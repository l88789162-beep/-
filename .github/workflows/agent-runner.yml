name: Agent Runner
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  run-task:
    runs-on: ubuntu-latest
    environment: 666
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.A }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy
      - name: Execute agent task
        run: python agent_scheduler.py
